name: Assemble Factory Image

on:
  push:
    branches: [main]
    paths:
      - 'assets/factory-hires/part10.txt'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble image
        run: |
          cat assets/factory-hires/part*.txt | tr -d '\n\r ' | base64 -d > assets/factory-showcase.webp
          test $(stat -c%s assets/factory-showcase.webp) -gt 60000
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/factory-showcase.webp
          git commit -m "Assemble high-resolution factory showcase image" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
