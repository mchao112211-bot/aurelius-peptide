name: Assemble Factory Image

on:
  push:
    branches: [main]
    paths:
      - 'assets/factory-data/**'
      - '.github/workflows/assemble-factory-image.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble high-resolution factory photo
        run: |
          cat assets/factory-data/part*.txt | tr -d '\n\r ' | base64 -d > assets/factory-showcase.jpg
          test $(stat -c%s assets/factory-showcase.jpg) -gt 50000
          file assets/factory-showcase.jpg | grep -q 'JPEG image data'
      - name: Commit factory photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/factory-showcase.jpg
          git commit -m "Replace blurry factory image with high-resolution photo" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
