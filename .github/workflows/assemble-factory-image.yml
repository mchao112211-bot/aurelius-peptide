name: Update Factory Photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-factory-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use sharp 1600px factory photo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'src="assets/factory-showcase.webp" alt="Facility showcase illustration"'
          new = 'src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Reinraum%20BBS%20Automation%20Blaichach.jpg?width=1600" alt="Facility showcase illustration"'
          if old not in s:
              raise SystemExit('factory image tag not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit only factory photo link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use sharp 1600px factory photo" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
