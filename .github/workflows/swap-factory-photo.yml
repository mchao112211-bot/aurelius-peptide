name: Swap Factory Photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-factory-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace broken factory image with JPG only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/factory-showcase.webp?v=factoryphoto1'
          new = 'assets/factory-showcase.jpg?v=factoryphoto2'
          assert s.count(old) == 1, f'expected one factory image reference, found {s.count(old)}'
          before_products = s.count('assets/products/')
          before_coa = s.count('/coa/')
          s = s.replace(old, new)
          assert s.count('assets/products/') == before_products
          assert s.count('/coa/') == before_coa
          assert new in s
          p.write_text(s, encoding='utf-8')
      - name: Commit only index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Use factory JPG in showcase"
          git push origin main