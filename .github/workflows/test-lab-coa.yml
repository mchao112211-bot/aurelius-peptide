name: Test Lab COA Fetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-lab-coa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Freedom Diagnostics Retatrutide lookup
        shell: bash
        run: |
          set -euo pipefail
          url='https://freedomdiagnosticstesting.com/search-for-your-coa-based-on-the-unique-accession-number/?code=2607010572'
          curl -L --fail --silent --show-error "$url" -o /tmp/server.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$url" > /tmp/rendered.html 2>/tmp/chrome.err || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          for label, path in [('server','/tmp/server.html'),('rendered','/tmp/rendered.html')]:
              text=Path(path).read_text(errors='ignore') if Path(path).exists() else ''
              print(f'--- {label} PDF candidates ---')
              urls=[]
              for m in re.finditer(r'''(?:href|src)=["']([^"']+)["']''', text, re.I):
                  u=m.group(1)
                  if '.pdf' in u.lower(): urls.append(u)
              for u in dict.fromkeys(urls): print(u)
              print(f'--- {label} relevant lines ---')
              for line in text.splitlines():
                  low=line.lower()
                  if '2607010572' in low or 'bgsr2607010572' in low or 'open pdf' in low:
                      print(line[:2000])
          PY
