name: Verify Live COA PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-lab-coa.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all ten PDFs on the live GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          base='https://mchao112211-bot.github.io/aurelius-peptide/coa'
          files=(retatrutide.pdf tirzepatide.pdf semaglutide.pdf tesamorelin.pdf sermorelin.pdf bpc-157.pdf tb-500.pdf ghk-cu.pdf mots-c.pdf ss-31.pdf)
          for f in "${files[@]}"; do
            echo "Checking $f"
            curl -L --fail --retry 8 --retry-delay 3 --connect-timeout 10 --max-time 30 "$base/$f" -o "/tmp/$f"
            test $(stat -c%s "/tmp/$f") -gt 10000
            head -c 5 "/tmp/$f" | grep -q '%PDF-'
            echo "OK $f $(stat -c%s "/tmp/$f") bytes"
          done
          echo 'ALL 10 LIVE COA PDFs VERIFIED'
