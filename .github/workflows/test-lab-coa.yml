name: Test Lab COA Fetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-lab-coa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Freedom Diagnostics lookup JavaScript
        shell: bash
        run: |
          set -euo pipefail
          url='https://freedomdiagnosticstesting.com/search-for-your-coa-based-on-the-unique-accession-number/'
          curl -L --fail --silent --show-error "$url" -o /tmp/page.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/page.html').read_text(errors='ignore')
          start=text.find("const R2_BASE_URL")
          end=text.find("document.getElementById('company-input').addEventListener", start)
          if start < 0:
              raise SystemExit('lookup JS not found')
          if end < 0:
              end=start+16000
          print(text[start:end+1500])
          PY
