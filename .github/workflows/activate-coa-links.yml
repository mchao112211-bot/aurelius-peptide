name: Activate COA Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-coa-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate COA section and bust old 404 cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('COA Display</h2><p>Each COA position corresponds directly to the product above.</p>',
                        'COA Verification</h2><p>Each certificate corresponds directly to the product above. Click View COA to open the verified PDF report.</p>')
          s = s.replace('PDF Pending', 'View COA')
          s = s.replace('.coa-btn{display:inline-flex;padding:8px 11px;border-radius:7px;background:#eaf0f6;color:#75869a;font-size:10px;font-weight:900}',
                        '.coa-btn{display:inline-flex;padding:9px 14px;border-radius:8px;background:#1681e6;color:#fff;font-size:10px;font-weight:900;box-shadow:0 5px 14px #1681e633;transition:.15s}.coa-btn:hover{transform:translateY(-1px);background:#0f70cb}')
          s = re.sub(r'href="coa/([a-z0-9-]+\.pdf)(?:\?[^\"]*)?"', r'href="coa/\1?v=20260816"', s)
          p.write_text(s, encoding='utf-8')

          assert 'PDF Pending' not in s
          assert s.count('>View COA</a>') == 10
          assert s.count('?v=20260816') == 10
          print('Activated 10 COA buttons with cache-busting URLs.')
          PY

      - name: Commit updated COA section
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate ten COA verification links" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
