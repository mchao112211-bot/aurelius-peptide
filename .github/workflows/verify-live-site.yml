name: Verify Live Site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-site.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify homepage, product images, factory video and COAs
        shell: bash
        run: |
          set -euo pipefail
          base='https://mchao112211-bot.github.io/aurelius-peptide'
          curl -L --fail --retry 8 --retry-delay 2 "$base/?verify=restore2" -o /tmp/index.html
          grep -q 'AURELIUSA' /tmp/index.html
          grep -q 'assets/factory.mp4?v=restore2' /tmp/index.html
          grep -q 'assets/products/retatrutide.webp?v=restore2' /tmp/index.html
          grep -q 'VIEW COA' /tmp/index.html
          ! grep -qi 'wikimedia' /tmp/index.html
          ! grep -qi 'products-sprite' /tmp/index.html

          products=(retatrutide tirzepatide semaglutide tesamorelin sermorelin bpc-157 tb-500 ghk-cu mots-c ss-31)
          for p in "${products[@]}"; do
            echo "Checking product: $p"
            curl -L --fail --retry 5 --retry-delay 2 "$base/assets/products/$p.webp?v=restore2" -o "/tmp/$p.webp"
            test $(stat -c%s "/tmp/$p.webp") -gt 2000
            test "$(head -c 4 "/tmp/$p.webp")" = 'RIFF'
            test "$(dd if="/tmp/$p.webp" bs=1 skip=8 count=4 2>/dev/null)" = 'WEBP'
          done

          echo 'Checking factory video'
          curl -L --fail --retry 5 --retry-delay 2 "$base/assets/factory.mp4?v=restore2" -o /tmp/factory.mp4
          test $(stat -c%s /tmp/factory.mp4) -gt 500000
          dd if=/tmp/factory.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q 'ftyp'

          pdfs=(retatrutide tirzepatide semaglutide tesamorelin sermorelin bpc-157 tb-500 ghk-cu mots-c ss-31)
          for p in "${pdfs[@]}"; do
            echo "Checking COA: $p"
            curl -L --fail --retry 5 --retry-delay 2 "$base/coa/$p.pdf?v=restore2" -o "/tmp/$p.pdf"
            test $(stat -c%s "/tmp/$p.pdf") -gt 10000
            head -c 5 "/tmp/$p.pdf" | grep -q '%PDF-'
          done

          echo 'ALL LIVE SITE ASSETS VERIFIED'