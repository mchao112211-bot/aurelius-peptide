name: Replace Anna Photo Once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message == 'Run Anna photo replacement'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace Anna photo
        shell: bash
        run: |
          cat assets/anna-data/part-*.txt | base64 -d > assets/team/anna.webp
          python - <<'PY'
          from pathlib import Path
          import base64, re
          index = Path('index.html')
          image = Path('assets/team/anna.webp')
          html = index.read_text(encoding='utf-8')
          data = base64.b64encode(image.read_bytes()).decode('ascii')
          replacement = f'<img class="sales-photo" src="data:image/webp;base64,{data}" alt="Anna">'
          pattern = r'<img class="sales-photo" src="data:image/webp;base64,[^"]+" alt="Anna">'
          html, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one Anna embedded image, found {count}')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit replacement and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/team/anna.webp
          git rm -r assets/anna-data .github/workflows/replace-anna-photo-once.yml
          git commit -m "Replace Anna sales photo"
          git push origin main
